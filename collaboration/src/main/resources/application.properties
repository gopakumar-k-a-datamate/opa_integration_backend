server.port=8085
spring.application.name=collaboration-service

# Java 21 Virtual Threads
spring.threads.virtual.enabled=true

# Database & HikariCP Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/collaboration_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.auto-commit=false

# JPA & Hibernate Configuration
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=collaboration_public

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.default-schema=collaboration_public

# Microservice Observability
management.endpoints.web.exposure.include=health,info,prometheus
