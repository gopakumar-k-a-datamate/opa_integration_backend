server:
  port: 8082

spring:
  application:
    name: clinic-modulith
  datasource:
    url: jdbc:postgresql://localhost:5434/clinic_db
    username: clinic_user
    password: clinic_password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"

# Bedrock Authz Configuration
datamate:
  authz:
    # Admin Policy APIs (PolicyController, ConditionFieldController, NamespaceController)
    # Set to true ONLY on the designated admin/identity service that manages policies.
    # Exposing these on a regular microservice is a security risk.
    admin:
      enabled: false
