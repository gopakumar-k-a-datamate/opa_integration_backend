input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Any custom mutations or enrichment can be placed here
}

output {
  if [isAudit] {
    # Long-term Immutable Regulatory Healthcare / Security Audit Trail (HIPAA / SOC2)
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "bedrock-audit-records-%{+YYYY.MM}"
    }
  } else {
    # 30-Day Rolling Operational Application Logs
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "bedrock-logs-%{+YYYY.MM.dd}"
    }
  }
  stdout {
    codec => rubydebug
  }
}
