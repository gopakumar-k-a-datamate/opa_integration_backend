spring.application.name=identity-service
spring.datasource.url=jdbc:postgresql://localhost:5435/identity_db
spring.datasource.username=myuser
spring.datasource.password=mypassword
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:migration

app.security.jwt.secret=YourSuperSecretKeyThatIsAtLeast32CharactersLongForJWTGeneration
app.security.jwt.expiration-ms=86400000

# Bedrock Security Framework Configuration
bedrock.security.implementation=jwt
bedrock.security.jwt.secret=YourSuperSecretKeyThatIsAtLeast32CharactersLongForJWTGeneration
bedrock.security.jwt.issuer=identity-service
bedrock.security.jwt.audience=datamate-applications
bedrock.security.jwt.access-token-expiration=1h
bedrock.security.permit-all=/api/v1/auth/login,/api/v1/auth/logout,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/actuator/health,/error

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

server.port=8085

# ===============================
# Bedrock auditing
# ===============================
bedrock.auditing.flow.enabled=true
bedrock.auditing.flow.include-args=false
bedrock.auditing.flow.include-result=false
bedrock.auditing.flow.async-enabled=false

# ===============================
# Spring Modulith Transactional Outbox
# ===============================
spring.modulith.events.completion-mode=${MODULITH_EVENT_MODE:archive}
spring.modulith.events.republish-outstanding-events-on-restart=${MODULITH_REPUBLISH_ON_RESTART:true}

# ===============================
# RabbitMQ Configuration
# ===============================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

