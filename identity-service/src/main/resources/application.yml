spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://localhost:5435/identity_db
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:migration
  modulith:
    events:
      completion-mode: ${MODULITH_EVENT_MODE:archive}
      republish-outstanding-events-on-restart: ${MODULITH_REPUBLISH_ON_RESTART:true}

app:
  security:
    jwt:
      secret: YourSuperSecretKeyThatIsAtLeast32CharactersLongForJWTGeneration
      expiration-ms: 86400000

bedrock:
  security:
    implementation: jwt
    jwt:
      secret: YourSuperSecretKeyThatIsAtLeast32CharactersLongForJWTGeneration
      issuer: identity-service
      audience: datamate-applications
      access-token-expiration: 1h
    permit-all: /api/v1/auth/login,/api/v1/auth/logout,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/actuator/health,/error
  auditing:
    flow:
      enabled: true
      include-args: false
      include-result: false
      async-enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8085
