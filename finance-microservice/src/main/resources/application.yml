server:
  port: 8081

spring:
  application:
    name: finance-microservice
  datasource:
    url: jdbc:postgresql://localhost:5433/finance_db
    username: finance_user
    password: finance_password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"

# Bedrock Authz Configuration
datamate:
  authz:
    # Admin Policy APIs (PolicyController, ConditionFieldController, NamespaceController)
    # Set to true ONLY on the designated admin/identity service that manages policies.
    # Exposing these on a regular microservice is a security risk.
    admin:
      enabled: false
    # OPA Bundle endpoint security
    bundle:
      api-key: ${BUNDLE_API_KEY:my-dev-secret}

