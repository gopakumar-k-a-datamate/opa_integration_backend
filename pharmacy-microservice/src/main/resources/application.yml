spring:
  application:
    name: pharmacy-microservice
  datasource:
    url: jdbc:postgresql://localhost:5433/pharmacy_db?options=-c%20TimeZone=Asia/Kolkata
    username: myuser
    password: mypassword
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration

server:
  port: 8083

# Bedrock Authz Configuration
datamate:
  authz:
    opa:
      config-path: classpath:opa-config.yaml
    # Admin Policy APIs (PolicyController, ConditionFieldController, NamespaceController)
    # Set to true ONLY on the designated admin/identity service that manages policies.
    # Exposing these on a regular microservice is a security risk.
    admin:
      enabled: false

authz:
  opa:
    validation-url: http://localhost:8183
logging:
  level:
    org.datamate.authz: DEBUG
